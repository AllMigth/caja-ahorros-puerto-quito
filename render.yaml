services:
    - type: web
    name: caja-puerto-quito
    runtime: java
    plan: free
    region: oregon
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar --spring.profiles.active=prod
    envVars:
            - key: JAVA_VERSION
        value: 17
            - key: SPRING_PROFILES_ACTIVE
        value: prod